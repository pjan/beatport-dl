name: "Update Inputs"

on:
  schedule:
    - cron: "0 20 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    name: Update action pins and nix version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}

  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Update flake inputs
        run: |
          nix flake update \
            nixpkgs \
            flake-utils

      - name: Validate build with updated inputs
        run: nix build .#default

      - name: Capture lock diff
        if: success()
        run: |
          {
            echo "LOCK_DIFF<<EOF"
            git diff flake.lock
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Open pull request if inputs changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/flake-lock
          commit-message: "chore(flake): update inputs"
          title: "chore(flake): update inputs"
          body: |
            Automated weekly update of flake inputs.

            <details>
            <summary>flake.lock diff</summary>

            ```
            ${{ env.LOCK_DIFF }}
            ```

            </details>
          labels: "dependencies"
          delete-branch: true
